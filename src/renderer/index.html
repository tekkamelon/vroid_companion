<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' blob: data:;">
  <title>VRoid Companion</title>
  <script type="importmap">
    {
      "imports": {
        "three": "../../node_modules/three/build/three.module.js"
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1a1a2e; color: #e0e0ff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
    #canvas-area { flex: 1; position: relative; }
    canvas { width: 100%; height: 100%; display: block; }
    #boot-note {
      position: absolute;
      inset: 16px auto auto 16px;
      z-index: 5;
      padding: 8px 10px;
      border: 1px solid rgba(143, 227, 255, 0.6);
      border-radius: 6px;
      background: rgba(15, 20, 44, 0.85);
      color: #8fe3ff;
      font-size: 13px;
      letter-spacing: 0.02em;
      pointer-events: none;
    }
    #status {
      position: fixed;
      top: 8px;
      left: 8px;
      z-index: 20;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(15, 20, 44, 0.85);
      color: #8fe3ff;
      font-size: 12px;
      pointer-events: none;
    }
    #chat-area { height: 200px; background: #16213e; display: flex; flex-direction: column; padding: 8px; gap: 8px; }
    #log { flex: 1; overflow-y: auto; font-size: 13px; line-height: 1.5; }
    #input-row { display: flex; gap: 8px; }
    #msg-input { flex: 1; background: #0f3460; border: 1px solid #533483; color: #e0e0ff; border-radius: 4px; padding: 6px 10px; font-size: 14px; }
    #send-btn { background: #533483; color: #fff; border: none; border-radius: 4px; padding: 6px 16px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="canvas-area">
    <div id="boot-note">VRoid Companion starting...</div>
    <canvas id="vrm-canvas"></canvas>
  </div>
  <div id="chat-area">
    <div id="log"></div>
    <div id="input-row">
      <input id="msg-input" type="text" placeholder="メッセージを入力...">
      <button id="send-btn">送信</button>
    </div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
