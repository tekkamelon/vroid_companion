<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- Content Security Policy: limit external resources -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' blob: data:; media-src 'self' blob: data:;">
  <title>VRoid Companion</title>
  <!-- import map for three.js -->
  <script type="importmap">
    {
      "imports": {
        "three": "../../node_modules/three/build/three.module.js"
      }
    }
  </script>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="canvas-area">
    <div id="boot-note">VRoid Companion starting...</div>
    <canvas id="vrm-canvas"></canvas>
  </div>
  <div id="chat-area">
    <div id="log"></div>
    <div id="input-row">
      <input id="msg-input" type="text" placeholder="Type a message...">
      <button id="send-btn">Send</button>
      <button id="log-toggle-btn" title="Toggle system logs">📝</button>
    </div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
