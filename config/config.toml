# VRoid Companion 設定ファイル

[agent]
# ACPサーバとして動作するエージェントの起動コマンドと引数
# zeroclaw の場合:
# command = "zeroclaw"
# args    = ["acp"]
# kilocodeの場合:
command = "opencode"
args    = ["acp"]
# opencode の場合:
# command = "opencode"
# args    = []
# goose の場合:
# command = "goose"
# args    = ["--acp"]  # 要確認
cwd = "/home/tekkamelon"  # エージェントのワーキングディレクトリ (絶対パス)

[model]
# VRMファイルのパス (assets/models/からの相対パス)
vrm_path = "assets/models/model.vrm"

[display]
width  = 800
height = 900

[tts]
enabled = false
provider = "openai"
model = "tts-1"
voice = "alloy"
response_format = "mp3"
# base_url が未設定の場合は OpenAI 公式 API が使用される
# base_url = "https://api.openai.com/v1"
# api_key は環境変数を推奨: 環境変数 OPENAI_API_KEY
# api_key = "sk-..."
