# VRoid Companion 設定ファイル

[agent]
# ACPサーバとして動作するエージェントの起動コマンドと引数
# zeroclaw の場合:
# command = "zeroclaw"
# args    = ["acp"]
# kilocodeの場合:
command = "kilocode"
args    = ["acp"]
# opencode の場合:
# command = "opencode"
# args    = []
# goose の場合:
# command = "goose"
# args    = ["--acp"]  # 要確認
cwd = "/home/yourname"  # エージェントのワーキングディレクトリ (絶対パス)

[model]
# VRMファイルのパス (assets/models/からの相対パス)
vrm_path = "assets/models/model.vrm"

[display]
width  = 800
height = 900
